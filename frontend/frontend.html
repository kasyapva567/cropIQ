<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropIQ — Farm smarter</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 4c-8 0-14 4-14 11a5 5 0 0 0 5 5c7 0 9-8 9-16Z" />
                        <path d="M4 21c2-5 6-8 11-11" />
                    </svg>
                </span>
                CropIQ
            </div>

            <div class="nav-label">WORKSPACE</div>
            <nav class="nav" id="nav"></nav>

            <div class="side-bottom">
                <div class="plan">
                    <b>Grow with CropIQ</b>
                    <p>Personalized insights for healthier, more productive farms.</p>
                    <a href="#" onclick="toast('Recommendations are coming soon'); return false">Explore features →</a>
                </div>
                <div class="profile">
                    <div class="avatar">RK</div>
                    <div><b>Ravi Kumar</b><small>Farm owner</small></div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:12px">
                    <button class="icon-btn mobile-menu" id="menu" aria-label="Open menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="crumb">
                        Workspace <span style="padding:0 8px;color:#bac2bb">/</span>
                        <strong id="crumb">Dashboard</strong>
                    </div>
                </div>

                <div class="top-actions">
                    <button class="icon-btn" aria-label="Notifications" onclick="toast('You’re all caught up')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
                        </svg>
                    </button>
                    <div class="top-user">RK</div>
                </div>
            </header>

            <div id="page" class="content"></div>
        </main>
    </div>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>

</html>
